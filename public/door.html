<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Door — Aletheia — To Uncover</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(ellipse at top, #1b1f3b 0%, #0b0d1a 60%, #05060f 100%);
      color: #e8e6f0;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; color: #fff; text-align: center; }
    .sub { text-align: center; color: #a8a6c0; font-size: 13.5px; margin-bottom: 18px; line-height: 1.5; }
    .video-box {
      position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 14px;
      overflow: hidden; background: #05060f; border: 1px solid #2e3358; margin-bottom: 14px;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scanline {
      position: absolute; left: 8%; right: 8%; height: 2px; background: #f5c542;
      box-shadow: 0 0 12px #f5c542; animation: scan 2.2s linear infinite; opacity: .8;
    }
    @keyframes scan { 0% { top: 12%; } 50% { top: 86%; } 100% { top: 12%; } }
    .video-box.off .scanline { display: none; }
    .cam-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8f8dab; font-size: 14px; text-align: center; padding: 20px; }
    .manual { display: flex; gap: 8px; margin-bottom: 10px; }
    .manual input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #33395f;
      background: #12142a; color: #fff; font-size: 16px; font-family: inherit; text-transform: uppercase;
    }
    .manual input:focus { outline: none; border-color: #f5c542; }
    .manual button {
      padding: 12px 18px; border-radius: 10px; border: none; background: #f5c542;
      color: #14173a; font-weight: bold; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .keyrow { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .keyrow input {
      flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #33395f;
      background: #12142a; color: #fff; font-size: 13px; font-family: inherit;
    }
    .keyrow label { font-size: 12.5px; color: #8f8dab; white-space: nowrap; }
    .result { min-height: 96px; margin-bottom: 14px; }
    .ticket-card {
      border-radius: 14px; padding: 18px; border: 1px solid; animation: pop .18s ease-out;
    }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .ticket-card.ok { background: #123c2a; border-color: #1e6b4a; }
    .ticket-card.warn { background: #3c3212; border-color: #6b5a1e; }
    .ticket-card.bad { background: #3c1212; border-color: #6b1e1e; }
    .ticket-card h2 { font-size: 19px; margin-bottom: 4px; }
    .ticket-card .meta { font-size: 13.5px; opacity: .85; line-height: 1.6; }
    .ticket-card .big { font-size: 26px; color: #f5c542; margin-top: 6px; }
    .stats { display: flex; gap: 10px; margin-top: 16px; }
    .stat { flex: 1; background: rgba(20,23,44,.85); border: 1px solid #2e3358; border-radius: 12px; padding: 12px; text-align: center; }
    .stat .n { font-size: 22px; color: #f5c542; font-weight: bold; }
    .stat .l { font-size: 11px; color: #8f8dab; text-transform: uppercase; letter-spacing: .06em; }
    a.back { color: #f5c542; font-size: 13px; text-decoration: none; display: block; text-align: center; margin-top: 18px; }
    .beep { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🚪 Door check-in</h1>
    <p class="sub">Point the camera at the attendee's ticket QR — or type their ticket ID.<br />Each scan checks in one person of the group.</p>

    <div class="keyrow">
      <label>Admin key</label>
      <input id="adminKey" type="password" placeholder="changeme123" />
    </div>

    <div class="video-box off" id="videoBox">
      <video id="video" autoplay playsinline muted></video>
      <div class="scanline"></div>
      <div class="cam-note" id="camNote">Camera off — tap "Start camera" (or just type the ID below)</div>
    </div>

    <div class="manual">
      <input id="ticketInput" placeholder="Ticket ID e.g. ME-7B1D4E" autocomplete="off" />
      <button id="checkBtn">Check in →</button>
    </div>

    <div class="result" id="result"></div>

    <div class="stats">
      <div class="stat"><div class="n" id="statArrived">0</div><div class="l">Arrived</div></div>
      <div class="stat"><div class="n" id="statInside">0</div><div class="l">Inside now</div></div>
      <div class="stat"><div class="n" id="statPaid">0</div><div class="l">Paid tickets</div></div>
    </div>

    <a class="back" id="monitorLink" href="/admin.html">← Full monitor</a>
  </div>

  <script>
    const KEY = new URLSearchParams(location.search).get("key") || sessionStorage.getItem("doorKey") || "";
    if (KEY) { document.getElementById("adminKey").value = KEY; sessionStorage.setItem("doorKey", KEY); }
    // carry the key through to the monitor link when we have it
    document.getElementById("monitorLink").href = KEY ? "/admin.html?key=" + encodeURIComponent(KEY) : "/admin.html";
    const keyNow = () => document.getElementById("adminKey").value.trim();
    let lastScan = "";
    let lastScanAt = 0;

    async function checkIn(ticketId) {
      const id = (ticketId || "").trim().toUpperCase();
      if (!id) return;
      const key = keyNow();
      if (!key) { showResult("bad", "Enter the admin key first."); return; }
      // debounce same scan within 3s
      const now = Date.now();
      if (id === lastScan && now - lastScanAt < 3000) return;
      lastScan = id; lastScanAt = now;

      try {
        const res = await fetch("/api/admin/checkin?key=" + encodeURIComponent(key), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Check-in failed");
        showResult("ok", null, data);
        ping();
      } catch (err) {
        // fetch the ticket to explain why not
        try {
          const r = await fetch("/api/status/" + id);
          const d = await r.json();
          if (d.error) showResult("bad", "Ticket not found: " + id);
          else if (d.status === "verifying" || d.status === "pending") showResult("warn", (d.name || "This ticket") + " hasn't completed payment (" + d.status + ").");
          else showResult("bad", err.message);
        } catch (_) {
          showResult("bad", err.message);
        }
        ping(false);
      }
    }

    function showResult(kind, message, data) {
      const el = document.getElementById("result");
      if (message) {
        el.innerHTML = `<div class="ticket-card ${kind}"><h2>${kind === "warn" ? "⏳ Hold on" : "✗ Can't check in"}</h2><div class="meta">${message}</div></div>`;
        return;
      }
      el.innerHTML = `<div class="ticket-card ok">
        <h2>✅ Welcome, ${data.name || "guest"}!</h2>
        <div class="meta">${data.checkedIn} of ${data.persons} checked in · ticket ${data.id || ""}</div>
        <div class="big">${data.checkedIn < data.persons ? (data.persons - data.checkedIn) + " more in this group" : "Group complete 🎉"}</div>
      </div>`;
    }

    // ---- stats ----
    async function refreshStats() {
      const key = keyNow();
      if (!key) return;
      try {
        const res = await fetch("/api/admin/data?key=" + encodeURIComponent(key));
        if (!res.ok) return;
        const d = await res.json();
        const paid = d.registrations.filter(r => r.status === "paid");
        document.getElementById("statPaid").textContent = paid.reduce((s, r) => s + r.persons, 0);
        document.getElementById("statInside").textContent = paid.reduce((s, r) => s + r.checkedIn, 0);
        // tickets arrived = groups with at least one checked-in
        document.getElementById("statArrived").textContent = paid.filter(r => r.checkedIn > 0).length;
      } catch (_) {}
    }
    function ping(good = true) { refreshStats(); if (good) beep(); }
    function beep() {
      try {
        const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = "sine";
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        o.start(); o.stop(ctx.currentTime + 0.26);
      } catch (_) {}
    }

    document.getElementById("checkBtn").addEventListener("click", () => checkIn(document.getElementById("ticketInput").value));
    document.getElementById("ticketInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkIn(e.target.value); });

    // ---- camera scanner ----
    let stream = null, detector = null, rafId = null;
    async function startCamera() {
      const box = document.getElementById("videoBox");
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById("video").srcObject = stream;
        box.classList.remove("off");
        document.getElementById("camNote").style.display = "none";
        if ("BarcodeDetector" in window) {
          detector = new BarcodeDetector({ formats: ["qr_code"] });
          scanLoop();
        } else {
          document.getElementById("camNote").style.display = "flex";
          document.getElementById("camNote").textContent = "This browser can't scan QRs natively — use the manual ID box above (or Chrome on Android).";
        }
      } catch (err) {
        document.getElementById("camNote").textContent = "Camera unavailable (" + err.message + "). Use the manual ID box.";
      }
    }
    async function scanLoop() {
      if (!detector || !stream) return;
      try {
        const video = document.getElementById("video");
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const codes = await detector.detect(video);
          if (codes.length) {
            const raw = codes[0].rawValue || "";
            const m = raw.match(/\/checkin\/([A-Z0-9-]+)/i);
            if (m) checkIn(m[1]);
          }
        }
      } catch (_) {}
      rafId = requestAnimationFrame(scanLoop);
    }
    document.getElementById("videoBox").addEventListener("click", startCamera);

    refreshStats();
    setInterval(refreshStats, 5000);
  </script>
</body>
</html>
